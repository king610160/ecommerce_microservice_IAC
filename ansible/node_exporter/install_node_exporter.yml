---
- name: Install and Configure Node Exporter
  hosts: "{{ hosts }}"
  become: yes
  vars_files:
    - "group_vars/node_exporter_servers.yml"

  tasks:
    # - name: Ensure firewalld is running (optional, based on your setup)
    #   ansible.builtin.systemd:
    #     name: firewalld
    #     state: started
    #     enabled: yes

    # - name: Open firewall port for Node Exporter
    #   ansible.posix.firewalld:
    #     port: "{{ node_exporter_port }}/tcp"
    #     permanent: yes
    #     state: enabled
    #     immediate: yes

    # 因為是封閉環境，所以會在外部下載好，放到 ec2-user 的目錄下
    - name: Download Node Exporter
      ansible.builtin.get_url:
        url: "https://github.com/prometheus/node_exporter/releases/download/v{{ node_exporter_version }}/node_exporter-{{ node_exporter_version }}.linux-amd64.tar.gz"
        dest: "/tmp/node_exporter.tar.gz"
        mode: '0644'

    - name: Unarchive Node Exporter
      ansible.builtin.unarchive:
        src: "/tmp/node_exporter.tar.gz"
        dest: "/tmp"
        remote_src: yes

    - name: Move binary to /usr/local/bin
      ansible.builtin.copy:
        src: "/tmp/node_exporter-{{ node_exporter_version }}.linux-amd64/node_exporter"
        dest: "{{ node_exporter_bin_dir }}/node_exporter"
        mode: '0755'
        remote_src: yes

    - name: Create Node Exporter Systemd Service
      ansible.builtin.copy:
        dest: /etc/systemd/system/node_exporter.service
        content: |
          [Unit]
          Description=Node Exporter
          After=network.target

          [Service]
          User={{ node_exporter_user }}
          ExecStart={{ node_exporter_bin_dir }}/node_exporter
          Restart=on-failure

          [Install]
          WantedBy=multi-user.target

    - name: Reload systemd and start Node Exporter
      ansible.builtin.systemd:
        name: node_exporter
        state: started
        enabled: yes
        daemon_reload: yes

    - name: Cleanup temporary files
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - "/tmp/node_exporter.tar.gz"
        - "/tmp/node_exporter-{{ node_exporter_version }}.linux-amd64"