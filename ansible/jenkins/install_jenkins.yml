---
- name: Install and Configure Jenkins
  hosts: "{{ hosts }}"
  become: yes  # 相當於 sudo
  vars_files:
    - "./group_vars/jenkins_servers.yml"  # 強制指定相對路徑
  tasks:
    - name: Update all packages (equivalent to dnf update)
      ansible.builtin.dnf:
        name: "*"
        state: latest

    - name: Install Java and Fontconfig
      ansible.builtin.dnf:
        name: 
          - fontconfig
          - "{{ java_package }}"
        state: present

    - name: Download Jenkins Repository file
      ansible.builtin.get_url:
        url: "{{ jenkins_repo_url }}"
        dest: /etc/yum.repos.d/jenkins.repo
        mode: '0644'

    - name: Import Jenkins GPG Key
      ansible.builtin.rpm_key:
        state: present
        key: "{{ jenkins_gpg_key }}"

    - name: Install Jenkins
      ansible.builtin.dnf:
        name: jenkins
        state: present

    - name: Allow Jenkins port in firewalld
      ansible.posix.firewalld:
        port: "{{ jenkins_port }}/tcp"
        permanent: yes
        state: enabled
        immediate: yes
      when: ansible_facts.services['firewalld.service'] is defined # 確保有啟動防火牆才下指令

    - name: Reload systemd manager configuration
      ansible.builtin.systemd:
        daemon_reload: yes

    - name: Ensure Jenkins is enabled and running
      ansible.builtin.systemd:
        name: jenkins
        state: started
        enabled: yes

    - name: Wait for Jenkins to start and generate initial password
      ansible.builtin.wait_for:
        path: /var/lib/jenkins/secrets/initialAdminPassword
        delay: 5

    - name: Show Initial Admin Password
      ansible.builtin.command: cat /var/lib/jenkins/secrets/initialAdminPassword
      register: initial_password
      changed_when: false

    - name: Print Initial Password to console
      ansible.builtin.debug:
        msg: "The initial admin password is {{ initial_password.stdout }}"