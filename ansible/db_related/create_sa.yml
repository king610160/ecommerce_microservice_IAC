- name: Setup RDS SA with SSL Verification
  hosts: frontend

  tasks:
    - name: 建立 Service Account (SA)
      shell: |
        mysql -e "CREATE USER IF NOT EXISTS 'ecommerce'@'%' IDENTIFIED BY 'ecommerce';"
        mysql -e "GRANT ALL PRIVILEGES ON ecommerce.* TO 'ecommerce'@'%';"
        mysql -e "FLUSH PRIVILEGES;"
      register: result

    # 這一段沒有顯示
    - name: 顯示執行結果
      debug:
        msg: "{{ result.stdout }}"